version: "2"
type: frontend
tech_stack:
  - HTML
  - Vanilla JS
  - CSS
  - Firebase SDK (Auth, Firestore, Storage)
routes:
  - path: /
    file: index.html
    auth_required: false
    description: Main SPA page containing login and all admin dashboard views.
features:
  - name: Admin Login
    description: Admin login using Firebase Auth
    files:
      - index.html
      - js/app.js
    entry_route: /
    user_interactions:
      - Fill email input
      - Fill password input
      - Click login button
      - See error if unauthorized
    api_calls: []
    auth_required: false
  - name: Jhome Academy Courses Management
    description: Create, read, update, delete courses
    files:
      - index.html
      - js/ui/AcademyView.js
      - js/repositories/JhomeRepository.js
    entry_route: /
    user_interactions:
      - Navigate to Academy tab
      - Click add course
      - Fill course form
      - Submit course form
    api_calls: []
    auth_required: true
  - name: Jhome Academy Student Requests
    description: View and approve student enrollment requests
    files:
      - index.html
      - js/ui/AcademyView.js
      - js/repositories/JhomeRepository.js
    entry_route: /
    user_interactions:
      - Navigate to Requests tab in a course
      - Click approve button
      - See generated credentials modal
    api_calls: []
    auth_required: true
known_limitations: []
